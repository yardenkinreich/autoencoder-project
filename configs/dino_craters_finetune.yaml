# DINOv2 FINETUNE from the stock ImageNet-pretrained checkpoint
# (data/raw/pretrained/dinov2_vits14_pretrain.pth), unlike dino_craters.yaml
# (a from-scratch training budget).
#
# Every DINO run before this one (dino_smoke_test, dino_wide/ep2,
# dino_wide/ep150) was actually from-scratch despite being called a
# "finetune" - the Snakefile's train_dino rule never passed pretrained
# weights, AND dino_craters.yaml's architecture (patch_size=8, in_chans=1)
# is fundamentally incompatible with the stock checkpoint's shapes
# (patch_size=14, in_chans=3) - the weights could never have loaded even if
# someone had tried. That's the root cause "training did not improve latent
# separation" - it was an undertrained from-scratch vit_small competing
# against a real ImageNet-scale pretrained model, not a finetuning failure.
#
# Architecture below matches the stock checkpoint EXACTLY (arch/patch_size/
# in_chans - required for load_state_dict to succeed; strict=False in
# ssl_meta_arch.py only tolerates missing/unexpected KEYS, not shape
# mismatches on keys present in both). Everything else is standard ViT
# finetuning practice: much lower LR, more aggressive layer-wise LR decay,
# a short schedule, frequent eval checkpoints.

student:
  arch: vit_small
  patch_size: 14           # MUST match the stock checkpoint - it's patch14, not our
                             # usual patch8 (dino_craters.yaml's from-scratch setting)
  in_chans: 3               # MUST match too - stock is RGB. CraterAugmentationDINO
                             # already replicates our single grayscale channel 3x
                             # when in_chans>1 (see dino_craters_augmentation.py) -
                             # no re-preprocessing of the .dat file needed.
  channel_adaptive: false
  drop_path_rate: 0.1
  pretrained_weights: "data/raw/pretrained/dinov2_vits14_pretrain.pth"

teacher:
  in_chans: 3
  channel_adaptive: false
  # Teacher temperature 0.04 -> 0.07. ssl_default_config warms it up over 30
  # epochs (built for 100+ epoch ImageNet runs) - on a 30-epoch finetune that
  # spans the whole run, so the teacher never settles and the DINO/iBOT
  # cross-entropies climb with its entropy to the very end (measured on the
  # first Kaguya runs). 5 epochs: settled by iteration 500.
  warmup_teacher_temp_epochs: 5

dino:
  # The stock checkpoint is backbone-only (no head/prototype weights at
  # all - verified directly: its state dict has no "head"/"dino" keys), so
  # the DINO head is freshly initialized regardless of finetuning vs
  # from-scratch - nothing to reset here, there's nothing pretrained to
  # reset FROM.
  head_n_prototypes: 4096

crops:
  # Matches stock DINOv2's own ssl_default_config.yaml exactly (global
  # [0.32,1.0], local [0.05,0.32]) - the previous values ([0.6,1.0] /
  # [0.25,0.6], "unchanged from dino_craters.yaml") gave local and global
  # crops nearly the same field of view: in linear terms (RandomResizedCrop's
  # scale is an AREA fraction) local spanned sqrt(0.25)-sqrt(0.6) = 50%-77%
  # of the base image and global 77%-100% - adjacent, overlapping ranges,
  # not the sharp scale contrast stock DINO relies on to make local/global
  # correspondence a real task. On our crop_crater() geometry (window =
  # diameter*(1+fov), fov=1.0 for dino_wide, resized to a fixed 128px base
  # image), that meant even the SMALLEST local crop (linear 50% of a
  # diameter*2-wide window = diameter*1.0) always contained the crater's
  # entire diameter - never a genuine local sub-patch, always ~the whole
  # crater. A coarse whole-image statistic like brightness is trivially
  # sufficient to solve "do these two views agree" when the views are this
  # similar in scale, regardless of augmentation strength - a different,
  # independent hypothesis from the GaussianBlur-probability-inversion fix
  # (see dino_craters_augmentation.py's v3 comment) and not ruled out by it.
  global_crops_scale: [0.32, 1.0]    # only used by global_crops_mode: random
  local_crops_scale: [0.05, 0.32]
  # Teacher views hard-wired (see dino_craters_augmentation.py): global crop
  # 1 = the whole image (crater + context, image_fov_diameters wide), global
  # crop 2 = centre crop exactly zoom_diameters wide (1.0 = the crater rim to
  # rim). image_fov_diameters must match the data: 2.0 for the wide
  # (offset 1.0) WAC dino_wide sets and the Kaguya catalogs.
  global_crops_mode: context_zoom
  image_fov_diameters: 2.0
  zoom_diameters: 1.0
  global_crops_size: 224              # RandomResizedCrop already resizes to this
                                        # regardless of the raw 128px .dat resolution
                                        # (see dino_craters_augmentation.py) - no new
                                        # preprocessing needed. Interpolated positional
                                        # embeddings handle the difference from the
                                        # checkpoint's native 518px training resolution,
                                        # standard ViT/DINOv2 behavior.
  local_crops_size: 98                # 14x7, an exact patch_size multiple - matches
                                        # dinov2/configs/eval/vits14_pretrain.yaml (Meta's
                                        # own reference config for loading this exact
                                        # checkpoint), NOT ssl_default_config.yaml's
                                        # from-scratch default of 96 (96/14 isn't clean)
  local_crops_number: 6

train:
  batch_size_per_gpu: 64    # smaller than dino_craters.yaml's 128 - 224px costs far
                              # more memory per sample than 128px did
  num_workers: 4
  OFFICIAL_EPOCH_LENGTH: 100
  saveckp_freq: 5
  crater_augmentation: true

optim:
  epochs: 10                  # short - finetuning adapts existing good features, it
                                # doesn't need dino_craters.yaml's 100-epoch from-scratch
                                # budget. 10 * 100 = 1000 iterations total.
  base_lr: 0.00002             # ~200x lower than the from-scratch default (0.004,
                                 # tuned for large-batch ImageNet-scale training from
                                 # nothing) - standard ViT finetuning LR range (1e-5 to
                                 # 5e-5), aggressive enough to disrupt the pretrained
                                 # weights fast if left at the from-scratch default.
  warmup_epochs: 1
  freeze_last_layer_epochs: 1
  layerwise_decay: 0.75        # more aggressive than DINOv2's own default (0.9) -
                                 # early backbone layers (generic edge/texture features,
                                 # still useful for craters) move very little; later
                                 # layers adapt more freely to the domain shift.
  patch_embed_lr_mult: 0.1     # patch_embed is the layer most exposed to the
                                 # resolution/channel change (224px vs the checkpoint's
                                 # 518px, replicated-grayscale vs true RGB) - keep it
                                 # especially stable rather than DINOv2's own 0.2 default.

evaluation:
  eval_period_iterations: 200   # check latent_separation.png often given the short
                                  # 1000-iteration schedule - stop early if it degrades
                                  # rather than waiting for the full budget to run out.

# Prototypical-loss auxiliary supervision (src/train/prototypical_loss.py) -
# absent from ssl_default_config.yaml's schema entirely (ssl_meta_arch.py
# reads it via cfg.get("proto", None), so a config without this section at
# all - e.g. dino_craters.yaml, the from-scratch config - still works
# unmodified). Draws ONLY from configs/new_test_set_split.csv's
# "train_pool" half (321 craters) - the "final_test" half and Julie's set
# are never touched by anything this config controls, by construction.
proto:
  enabled: true
  loss_weight: 0.2          # small and weighted, not a raw unweighted sum - see session
                              # discussion: the episode's ~20-40 craters/step are a much
                              # smaller, higher-variance signal than the 50k-crater
                              # unlabeled pool the rest of the loss sees, so this is meant
                              # as a gentle nudge, not an equal-weight objective. Watch
                              # proto_loss in the loss curve/tensorboard before raising it.
  n_support_per_class: 5     # per episode, per class - the rest of that class's pool
                              # craters become query for that episode
  dat_path: "data/processed_wac_100m_new/sigma/100/new_test_set_wide/craters.dat"
  metadata_csv: "data/processed_wac_100m_new/sigma/100/new_test_set_wide/metadata.csv"
  split_csv: "configs/liorr_labels_split.csv"   # baseline split: old halves kept, new
                                                  # labels split 50/50 (eval/new_test_set_split.py --extend)
  class_names: ["v-fr", "r-fr", "r-dr", "v-dr"]
  # Teacher-style augmented views of every labelled crater (context + zoom,
  # blur/solarize/jitter/flips + rot90 - src/train/labeled_views.py) and
  # class-balanced episodes. Images stored at store_size so the 1xD zoom is
  # a native crop. false = the old fixed, unaugmented rendering.
  augment: true
  store_size: 448
  n_query_per_class: 32
  crop_size: 224              # matches crops.global_crops_size - same input convention
                                # the rest of this run's images go through
  seed: 0

# Ordinal supervised-contrastive auxiliary loss (src/train/supcon_loss.py) -
# OFF by default, so every existing run is unchanged. Enable with
# OBJECTIVE=supcon in slurm/train_dino_finetune_kaguya.sbatch (which also
# turns proto off). Same train_pool-only data as proto: on a catalog,
# train_dino.py points catalog/split_csv at <catalog>/testset and
# configs/liorr_labels_split.csv. final_test is never touched.
supcon:
  enabled: false
  loss_weight: 0.2
  tau: 0.1                  # contrastive temperature
  ordinal_sigma: 0.75       # class-distance kernel: 1 / 0.41 / 0.03 / ~0 for 0/1/2/3 steps; 0 = plain SupCon
  per_class: 16             # class-balanced: 16 craters per class per step, 2 views each = 128 images
  teacher_views: true       # the teacher's context+zoom global views (+rot90), stored at store_size
  store_size: 448
  zoom_min: 0.5             # (teacher_views: false only) random centred zoom between the 2xD context and the 1xD crater
  jitter: 0.15              # contrast/brightness jitter (normalized units)
  class_names: ["v-fr", "r-fr", "r-dr", "v-dr"]
  crop_size: 224
  catalog: null
  split_csv: "configs/liorr_labels_split.csv"
  seed: 0

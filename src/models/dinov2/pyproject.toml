[tool.black]
line-length = 120

[tool.pylint.master]
persistent = false
score = false

[tool.pylint.messages_control]
disable = "all"
enable = [
  "miscellaneous",
  "similarities",
]

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
min-similarity-lines = 8

[tool.pylint.reports]
reports = false

[tool.pylint.miscellaneous]
notes = [
  "FIXME",
  "XXX",
  "TODO",
]

[tool.pixi.workspace]
name = "dinov2"
channels = ["rapidsai", "conda-forge", "nvidia","pytorch"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.12"
pytorch = { version = ">=2.7.1,<3", build = "cuda*" }
torchvision = ">=0.23.0,<0.24"
numpy = "*"
omegaconf = "*"
fvcore = "*"
iopath = "*"

[tool.pixi.pypi-dependencies]
dinov2 = { path = ".", editable = true }
xformers = "*"
submitit = "*"

[tool.pixi.system-requirements]
cuda = "13"

[tool.pixi.tasks]
